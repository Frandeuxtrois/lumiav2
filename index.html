<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turnos</title>
  </head>
  <body>
    <script>
      // Aplica el tema antes del primer paint para evitar flash.
      // Default light MIENTRAS dure la migracion de colores hardcodeados:
      // en dark todavia quedan cards blancas sobre fondo negro. Cuando las
      // fases 2 y 3 terminen, esto vuelve a default dark.
      (function () {
        try {
          if (localStorage.getItem('awd-theme') === 'dark') {
            document.body.classList.add('dark-mode');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
